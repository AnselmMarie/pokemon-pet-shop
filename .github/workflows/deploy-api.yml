name: Deploy API to AWS Dev

on:
  push:
    branches:
      - mfe
    paths:
      - 'app-hosts/api/**'
      - 'libs/types/**'
      - 'libs/utils/pricing/**'

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID_DEV: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: dev-${{ github.sha }}
        run: |
          docker build -f app-hosts/api/Dockerfile -t pokemon-api .
          docker tag pokemon-api:latest $ECR_REGISTRY/pokemon-api:dev
          docker tag pokemon-api:latest $ECR_REGISTRY/pokemon-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/pokemon-api:dev
          docker push $ECR_REGISTRY/pokemon-api:$IMAGE_TAG
